<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRUD Contrato</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-grid { grid-template-columns: 1fr 1fr 1fr; }
    </style>
</head>
<body>

<div class="container">
    <h1>📄 Gestión de Contratos</h1>

    <!-- FORMULARIO -->
    <div class="card">
        <h2 id="form-titulo">Nuevo Contrato</h2>
        <div class="form-grid">
            <div class="form-group">
                <label>Cliente *</label>
                <select id="idCliente">
                    <option value="">-- Seleccione un cliente --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Apartamento *</label>
                <select id="idApartamento">
                    <option value="">-- Seleccione un apartamento --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Fecha Inicio *</label>
                <input type="datetime-local" id="fechaInicio">
            </div>
            <div class="form-group">
                <label>Fecha Fin</label>
                <input type="datetime-local" id="fechaFin">
            </div>
            <div class="form-group">
                <label>Valor Mensual *</label>
                <input type="number" id="valorMensual" min="0" step="0.01" placeholder="Ej: 800000">
            </div>
            <div class="form-group">
                <label>Observación</label>
                <input type="text" id="observacion" maxlength="100" placeholder="Opcional">
            </div>
        </div>
        <div class="form-actions">
            <button class="btn-guardar" onclick="guardar()">💾 Guardar</button>
            <button class="btn-cancelar" onclick="limpiar()">✖ Cancelar</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Apartamento</th>
                <th>Fecha Inicio</th>
                <th>Fecha Fin</th>
                <th>Valor Mensual</th>
                <th>Observación</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>
</div>

<script src="app.js"></script>
</body>
</html>
